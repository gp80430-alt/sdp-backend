<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>성동 패스 관리자 대시보드</title>
    <meta name="description" content="성동구청 공공 리워드 플랫폼 관리자 시스템" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Google Maps JS API: VITE_GMAPS_KEY를 .env에 설정하세요 -->
    <script>
      window.__GMAPS_LOADED__ = false;
      window.__GMAPS_CALLBACKS__ = [];
      window.initGoogleMaps = function() {
        window.__GMAPS_LOADED__ = true;
        window.__GMAPS_CALLBACKS__.forEach(cb => cb());
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
